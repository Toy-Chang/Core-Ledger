server:
  port: 8080

spring:
  application:
    name: core-ledger-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/coreledger?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:coreledger}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html

core-ledger:
  jwt:
    secret: ${JWT_SECRET:change_me_to_a_long_random_secret_at_least_32_chars}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:7200}
  idempotency:
    ttl-seconds: ${IDEMPOTENCY_TTL_SECONDS:3600}
  cache:
    account-ttl-seconds: ${ACCOUNT_CACHE_TTL_SECONDS:300}
    null-ttl-seconds: ${NULL_CACHE_TTL_SECONDS:60}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"
